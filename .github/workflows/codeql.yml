name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - uses: actions/checkout@v4 # pin to commit SHA in high-assurance deploys
      - uses: github/codeql-action/init@v3 # pin to commit SHA in high-assurance deploys
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3 # pin to commit SHA in high-assurance deploys
